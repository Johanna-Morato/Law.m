{% extends "layout.html" %}

{% block title %}
Editar cliente | Law.m
{% endblock %}

{% block contenido %}

<div class="container mt-5">

    <h2 class="logo-navbar">
        Law.m
    </h2>

    <h3 class="mt-4">Editar cliente</h3>
    <p class="text-muted">
        Actualiza la información del cliente.
    </p>

    <form method="post">

        <div class="mb-3">

            <label class="form-label">
                Nombre
            </label>

            <input
                class="form-control"
                name="nombre"
                value="{{ cliente.nombre }}">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Teléfono
            </label>

            <input
                class="form-control"
                name="telefono"
                value="{{ cliente.telefono }}">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Correo
            </label>

            <input
                class="form-control"
                name="correo"
                value="{{ cliente.correo }}">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Dirección
            </label>

            <input
                class="form-control"
                name="direccion"
                value="{{ cliente.direccion }}">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Observaciones
            </label>

            <textarea
                class="form-control"
                name="observaciones">{{ cliente.observaciones }}</textarea>

        </div>
        <button class="btn btn-dark">
            Guardar cambios
        </button>
        <a href="{{ url_for('clientes') }}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
